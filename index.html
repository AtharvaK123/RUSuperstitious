<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RU Superstitious teleprompter</title>
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#07080b;--ink:#f4f1ea;--dim:#6d7280;--bar:#12141a;--line:#2a2e38;--accent:#ff4d4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100%;overflow:hidden}
html{height:100vh;height:100dvh;overflow:hidden}
#bar{flex:none;position:relative;z-index:5}
#stage{position:relative;flex:1;min-height:0}
#scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:38vh 7vw 70vh;padding-top:38dvh;padding-bottom:70dvh;-webkit-overflow-scrolling:touch}
#scroll::-webkit-scrollbar{display:none}
#scroll.mirror{transform:scaleX(-1)}
.seg{max-width:1100px;margin:0 auto 1.6em;border-left:.12em solid var(--c);padding-left:.7em}
.who{font-size:.45em;font-weight:700;color:var(--c);margin-bottom:.5em;letter-spacing:.02em}
.seg p{margin:0 0 .75em;font-size:1em;line-height:1.38;font-weight:600}
.seg p.q{font-style:italic;color:#d9d4c7}
#marker{position:absolute;left:0;right:0;top:38vh;top:38dvh;height:0;pointer-events:none;border-top:2px solid rgba(255,77,77,.55)}
#marker::before,#marker::after{content:"";position:absolute;top:-11px;border:10px solid transparent}
#marker::before{left:0;border-left-color:var(--accent)}
#marker::after{right:0;border-right-color:var(--accent)}
#fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--bg),transparent 22%,transparent 78%,var(--bg))}
#bar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bar);border-top:1px solid var(--line);font-size:14px}
#bar label{display:flex;align-items:center;gap:8px;color:var(--dim)}
#bar input[type=range]{width:120px;accent-color:var(--accent)}
button{font:inherit;color:var(--ink);background:#1d212b;border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover{background:#262b38}
button:focus-visible,input:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px}
#play{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;min-width:96px}
#hint{color:var(--dim);font-size:12px;width:100%;text-align:center}
.w.done{color:#5d6270}
.w.now{color:#fff;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:.06em;text-underline-offset:.12em}
#status{color:#7dd3fc;font-size:13px;min-width:0}
#voice[aria-pressed=true]{background:#1f6f4a;border-color:#2fa56f}
body.clean #bar{display:none}
body.clean #peek{display:block}
#peek{display:none;position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));opacity:.35}
#status:empty{display:none}
#gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(7,8,11,.95)}
#gate.off{display:none}
#gate .card{max-width:420px;text-align:center}
#gate h1{font-size:24px;margin:0 0 12px}
#gate p{color:#b9bdc9;line-height:1.5;margin:0 0 20px}
#gate button{display:block;width:100%;min-height:48px;margin:0 0 10px;font-size:16px}
#allow{background:var(--accent);border-color:var(--accent);font-weight:700}
#gate #gmsg{color:#ffb4b4;font-size:14px;margin:12px 0 0}
#peek:hover{opacity:1}
@media (max-width:700px){
#hint{display:none}
#bar{gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));font-size:13px}
#bar button{min-height:44px;flex:1 1 30%;padding:8px 6px}
#bar label{flex:1 1 100%}
#bar input[type=range]{flex:1;width:auto;min-height:32px}
#status{flex:1 1 100%;text-align:center}
#peek{opacity:.6;min-height:44px}
.seg{padding-left:.5em}
}
@media (max-height:480px) and (orientation:landscape){
#bar{gap:6px 10px;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
#bar button{min-height:36px;flex:0 0 auto}
#bar label{flex:1 1 140px}
}
</style>
</head>
<body>
<div id="stage">
  <div id="scroll" tabindex="-1" aria-label="Script"></div>
  <div id="fade"></div>
  <div id="marker"></div>
</div>
<div id="bar">
  <button id="restart" title="Back to the top (R)">Restart</button>
  <button id="play" title="Space">Play</button>
  <button id="voice" aria-pressed="false" title="Scroll as you read out loud (V)">Follow my voice</button>
  <label>Speed <input id="speed" type="range" min="1" max="12" value="4"></label>
  <label>Text size <input id="size" type="range" min="28" max="110" value="64"></label>
  <button id="mirror" aria-pressed="false" title="Mirror text (M)">Mirror</button>
  <button id="hide" title="Hide controls (H)">Hide controls</button>
  <div id="status" role="status"></div>
  <div id="hint">Space = play/pause · V = follow voice · ↑ ↓ = speed · M = mirror · H = hide controls · R = restart · scroll to nudge</div>
</div>
<button id="peek">Show controls</button>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gt">
  <div class="card">
    <h1 id="gt">Turn on voice following?</h1>
    <p>The script scrolls as you read it out loud. Your browser will ask to use the microphone. Tap Allow when it does.</p>
    <button id="allow">Enable microphone</button>
    <button id="skip">Skip, scroll manually</button>
    <p id="gmsg"></p>
  </div>
</div>

<script>
const SCRIPT = [
 {who:"Atharva — TV anchor", c:"#ffd166", p:[
  "Happy holidays, Scarlet Knights, and welcome to RU Superstitious—the only campus broadcast dedicated to uncovering the myths, legends, and traditions hiding right under our noses here in New Brunswick!",
  "I’m your anchor, Atharva. As the semester winds down and the holiday season kicks into full gear, Rutgers students are looking for all the luck, love, and graduation magic they can get.",
  "Today, our field reporters are braving the chilly November weather across campus to investigate three of Rutgers’ most famous superstitions—and find out if students actually believe in them.",
  "First up, let’s head over to Voorhees Hall on College Ave, where Tamarr Goodwin is standing by. Tamarr, take it away!"]},
 {who:"Tamarr Goodwin — Reporter 1", c:"#6ee7b7", p:[
  "Tamarr Goodwin coming at you from Voorhees Mall on College Ave in front of William the Silent – better known as “Silent Willie” or “Still Bill”. This 2-ton, 15-foot bronze statue was gifted to Rutgers by the Holland Society of New York in 1928 to acknowledge the university’s Dutch heritage; the statue honors William I, Prince of Orange, who led the revolt against Spain. Due to Willie’s symbolic prominence, he’s fallen victim to vandalism from rival schools like Princeton over the years.",
  "It’s said that Willie the Silent will whistle at a virgin who walks past his statue. However, the running joke from Rutgers folklorist Angus Kress Gillespie is that “he hasn’t whistled in the last 200 years”. It’s a common college campus trope of a statue reacting to a virgin, and for Rutgers, that’s Still Bill.",
  "So let’s hear from some Rutgers students on this topic. Have you ever heard of Willie the Silent? When was the first time you heard about it, and from whom? Have you ever heard the famed whistle? Do you believe in the folktale or think it’s just a fun tradition?"]},
 {who:"Julia Hubbard — Reporter 2", c:"#7dd3fc", p:[
  "This is Julia Hubbard with RU Superstitious, coming to you from College Ave, home of the Class of 1902 Memorial Gateway. It sits in front of the north entrance to Queens Campus from Hamilton Street. The arch is made of iron and was presented by… you guessed it, the graduating class of 1902. More information can be found at Rutgers University Institutional Planning and Operations.",
  "Superstition here at Rutgers has it that if you walk through the gate before you graduate, you won’t graduate, or at least not on time. We at RU Superstitious think it comes from the gate being the original ceremonial entrance where the University held commencement on that lawn, and students would walk through it upon graduating.",
  "Let’s turn to the students of Rutgers now. Have you heard about this gate superstition? When did you first hear about it? Do you avoid the gate? What version of the story did you hear, and who told you?",
  "Did you know that University commencement used to take place on that lawn, and that these gates have signified the achievement of Rutgers alumni? Do you think that has anything to do with people choosing the gates for their grad photos—or is it just a cute photo op?"]},
 {who:"Joseph & Jimena Muniz — Reporter 3", c:"#f9a8d4", p:[
  "This is Joseph Muniz with RU Superstitious, coming to you from Cook/Douglass Campus, home of the famous Passion Puddle. Located near Red Oak Lane, Passion Puddle is more than just a peaceful spot on campus. It’s also home to one of Rutgers’ most popular romantic superstitions.",
  "Superstition here at Rutgers has it that if a couple walks around Passion Puddle three times together, they’re destined to live happily ever after. According to an April 2014 article titled “Rutgers’ Myths and Legends Part 2: Passion Puddle,” published on the blog Passing the Baton, the original legend involved a Douglass girl and a Cook boy. We at RU Superstitious think this tradition may have started because Douglass was historically an all-women’s college, while Cook had a large male student population.",
  "Let’s turn to the students of Rutgers now. Have you heard of the Passion Puddle superstition? When did you first hear about it, and who told you? Have you ever walked around the pond with someone you’re interested in? Did you know the original legend involved a Douglass girl and a Cook boy? Do you actually believe in the superstition, or do you think it’s just a fun Rutgers tradition?"]},
 {who:"Atharva — TV anchor wrap-up", c:"#ffd166", p:[
  "Thanks, Jimena and Joseph—and huge thanks to Tamarr and Julia for braving the chilly New Brunswick weather to uncover the truth behind Rutgers’ biggest campus legends.",
  "With the holiday season right around the corner and finals week sneaking up faster than Santa’s sleigh, we could all use a little extra magic on campus! Whether you’re dodging the Class of 1902 gates so you actually graduate on time, taking a festive stroll around Passion Puddle, or rubbing Mason Gross’s nose like Rudolph’s for a little finals luck, Scarlet Knight traditions are definitely alive and well.",
  "Do you believe in these campus legends, or are they just holiday folklore? Let us know in the comments below!",
  "Thanks for tuning in to RU Superstitious. I’m Atharva—wishing you happy holidays, good luck on finals, and we’ll see you next time!"]}
];

const $ = id => document.getElementById(id);
const sc = $("scroll");
const WORDS = [];
const norm = w => w.toLowerCase().replace(/[^a-z0-9]/g, "");
SCRIPT.forEach(s => {
  const d = document.createElement("div");
  d.className = "seg"; d.style.setProperty("--c", s.c);
  const w = document.createElement("div"); w.className = "who"; w.textContent = s.who; d.appendChild(w);
  s.p.forEach(t => {
    const [txt, cls] = t.split("|");
    const p = document.createElement("p"); if (cls) p.className = cls;
    txt.split(/(?<=—)|\s+/).forEach(tok => {
      const sp = document.createElement("span"); sp.textContent = tok; p.appendChild(sp);
      const n = norm(tok);
      if (n) { sp.className = "w"; sp.dataset.i = WORDS.length; WORDS.push({el: sp, n}); }
      if (!tok.endsWith("—")) p.appendChild(document.createTextNode(" "));
    });
    d.appendChild(p);
  });
  sc.appendChild(d);
});

let pos = 0, playing = false, last = 0;
const speedPx = () => +$("speed").value * 12;

function setPlaying(v){
  if (v && voice) setVoice(false);
  if (v) keepAwake();
  playing = v; $("play").textContent = v ? "Pause" : "Play";
  if (v && sc.scrollTop >= sc.scrollHeight - sc.clientHeight - 2) { pos = 0; sc.scrollTop = 0; }
}
function tick(t){
  const dt = Math.min((t - last) / 1000, 0.1); last = t;
  if (voice) voiceScroll(dt);
  if (playing) {
    pos += speedPx() * dt; sc.scrollTop = pos;
    if (pos >= sc.scrollHeight - sc.clientHeight) setPlaying(false);
  }
  requestAnimationFrame(tick);
}
sc.addEventListener("scroll", () => { if (Math.abs(sc.scrollTop - pos) > 2) pos = sc.scrollTop; });

function setSize(){ sc.style.fontSize = $("size").value + "px"; }
function toggleMirror(){
  const on = sc.classList.toggle("mirror");
  $("mirror").setAttribute("aria-pressed", on);
}
function restart(){ setPlaying(false); cur = 0; markDone(); pos = 0; sc.scrollTop = 0; }
function hideBar(on){ document.body.classList.toggle("clean", on); }
function nudge(d){ const s = $("speed"); s.value = Math.max(1, Math.min(12, +s.value + d)); }

$("play").onclick = () => setPlaying(!playing);
$("restart").onclick = restart;
$("size").oninput = setSize;
$("mirror").onclick = toggleMirror;
$("hide").onclick = () => hideBar(true);
$("peek").onclick = () => hideBar(false);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.key.startsWith("Arrow")) return;
  const k = e.key.toLowerCase();
  if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowUp") { e.preventDefault(); nudge(1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); nudge(-1); }
  else if (k === "v") setVoice(!voice);
  else if (k === "m") toggleMirror();
  else if (k === "r") restart();
  else if (k === "h") hideBar(!document.body.classList.contains("clean"));
});
// ---- Voice following ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let voice = false, rec = null, cur = 0;
const say = t => { $("status").textContent = t; };
const same = (a, b) => a === b || (a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a)));

function markDone(){
  WORDS.forEach((w, i) => { w.el.classList.toggle("done", i < cur); w.el.classList.toggle("now", i === cur); });
}
function targetFor(i){
  const el = WORDS[Math.min(i, WORDS.length - 1)].el;
  const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;
  return Math.max(0, top - window.innerHeight * 0.38);
}
function voiceScroll(dt){
  pos += (targetFor(cur) - pos) * Math.min(1, dt * 3);
  sc.scrollTop = pos;
}
function follow(text){
  const heard = text.split(/\s+/).map(norm).filter(Boolean).slice(-6);
  for (let k = Math.min(4, heard.length); k >= 1; k--) {
    const tail = heard.slice(-k);
    if (k === 1 && tail[0].length < 5) break;
    const reach = k === 1 ? 12 : 45;
    let best = -1;
    for (let i = Math.max(0, cur - 4); i <= Math.min(WORDS.length - k, cur + reach); i++) {
      let ok = true;
      for (let j = 0; j < k; j++) if (!same(WORDS[i + j].n, tail[j])) { ok = false; break; }
      if (ok && (best < 0 || Math.abs(i - cur) < Math.abs(best - cur))) best = i;
    }
    if (best >= 0) { cur = best + k; markDone(); return; }
  }
}
function stopVoice(){
  voice = false;
  if (rec) { rec.onend = null; try { rec.stop(); } catch (_) {} rec = null; }
  $("voice").setAttribute("aria-pressed", "false"); say("");
}
function setVoice(on){
  if (!on) return stopVoice();
  if (!SR) { say("Voice following needs Chrome, Edge or Safari."); return; }
  setPlaying(false);
  rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
  rec.onresult = e => follow(e.results[e.results.length - 1][0].transcript);
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      stopVoice(); say("Mic blocked. Allow microphone access, or open the page in its own tab.");
    } else if (e.error !== "no-speech" && e.error !== "aborted") say("Mic error: " + e.error);
  };
  rec.onend = () => { if (voice) try { rec.start(); } catch (_) {} };
  voice = true; keepAwake(); pos = sc.scrollTop;
  try { rec.start(); } catch (_) {}
  $("voice").setAttribute("aria-pressed", "true");
  say("Listening… read the script out loud. Tap any word to jump there.");
}
$("voice").onclick = () => setVoice(!voice);
sc.addEventListener("click", e => {
  const s = e.target.closest(".w"); if (!s) return;
  cur = +s.dataset.i; markDone();
  if (!voice) { pos = targetFor(cur); sc.scrollTop = pos; }
});

// ---- Microphone prompt on open ----
const gate = $("gate");
const closeGate = () => gate.classList.add("off");
$("skip").onclick = closeGate;
$("allow").onclick = async () => {
  $("gmsg").textContent = "";
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("unsupported");
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
    closeGate(); setVoice(true);
  } catch (e) {
    $("gmsg").textContent = e && e.name === "NotAllowedError"
      ? "Microphone is blocked. Allow it in your browser’s site settings, or open this page in its own tab, then try again."
      : "Couldn’t reach the microphone here. Try opening this page in its own tab.";
  }
};
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: "microphone" }).then(r => { if (r.state === "granted") closeGate(); }).catch(() => {});
}

// ---- Mobile: keep the screen on while reading, smaller default text ----
let wl = null;
async function keepAwake(){
  try {
    if ("wakeLock" in navigator && !wl) {
      wl = await navigator.wakeLock.request("screen");
      wl.addEventListener("release", () => { wl = null; });
    }
  } catch (_) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && (playing || voice)) keepAwake();
});
if (innerWidth < 700) $("size").value = innerWidth < 420 ? 36 : 48;
setSize();
requestAnimationFrame(t => { last = t; tick(t); });
</script>
</body>
</html>
